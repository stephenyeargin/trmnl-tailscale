---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: latest
serverless_language: node
polling_url: |
  https://api.tailscale.com/api/v2/tailnet/{{ tailscale_org_id }}/settings
  https://api.tailscale.com/api/v2/tailnet/{{ tailscale_org_id }}/devices?fields=default
polling_headers: content-type=application/json&authorization=Bearer {{ tailscale_api_key }}
polling_body: 
id: 108109
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_bio
  name: About This Plugin
  field_type: author_bio
  category: productivity
  description: Show the status of devices on your Tailscale network.
  github_url: https://github.com/stephenyeargin/trmnl-tailscale
  learn_more_url: https://tailscale.com/
  email_address: stephen@yearg.in
- keyname: tailscale_api_key
  field_type: password
  name: Tailscale API Key
  description: The API Key for Tailscale, available on the <a href="https://login.tailscale.com/admin/settings/keys" target="_blank" class="underline">Keys</a> page.
  placeholder: tskey-api-xxxxxxxxxxxx-xxxxxxxxxxx
- keyname: tailscale_org_id
  field_type: string
  name: Tailscale Org ID
  description: The organization or username associated with the Tailnet as shown on <a href="https://login.tailscale.com/admin/settings/general" target="_blank" class="underline">General</a> page.
  placeholder: myorgname.github
name: Tailscale
description: Device status on your tailnet
refresh_interval: 15
